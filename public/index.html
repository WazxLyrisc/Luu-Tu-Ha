<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat với Lyrisc (bản AI)</title>
<link rel="icon" href="./Zennomi.jpg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
<main class="layout">
  <section class="card stage" aria-label="Nhân vật Vtuber">
    <div id="stage" class="stage-view">
      <canvas id="vtuber-canvas" aria-hidden="true"></canvas>
      <img id="stage-fallback" class="stage-fallback" src="./avatar.svg" alt="Ảnh đại diện" hidden>
      <p id="stage-loading" class="stage-note">Đang tải nhân vật...</p>
      <p id="stage-chip" class="stage-chip" role="status" hidden></p>
      <button type="button" id="voice-btn" class="voice-btn" aria-pressed="false">Giọng nói: tắt</button>
    </div>
  </section>

  <section class="card chat" aria-label="Chatbot">
    <header class="bot-head">
      <img src="./Cosplay Miku.jpg" alt="Ảnh đại diện" class="avatar">
      <div>
        <h1>WazxLyrisc</h1>
        <p>Bản sao AI của WazxLyrisc nhưng mà là WazxLyrisc-Female</p>
      </div>
    </header>
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="chat-form" class="composer">
      <input id="chat-input" type="text" placeholder="Nhắn gì đó cho Lyrisc..." autocomplete="off" maxlength="500" required>
      <button type="submit" id="send-btn">Gửi</button>
    </form>
  </section>

  <details class="card feedback" aria-label="Phản hồi">
    <summary>Góc Feedback cho WazxLyrisc</summary>
    <p class="hint">Bạn muốn WazxLyrisc-Admin làm gì trong tương lai thì hãy feedback lại nhé! Hoặc là AI lỗi thì cũng Feedback lại nhé!!!!</p>
    <form id="fb-form">
      <label>Tên (không bắt buộc)
        <input id="fb-name" type="text" maxlength="60">
      </label>
      <fieldset class="stars">
        <legend>WazxLyrisc-Female có thực sự giống female ?</legend>
        <input type="hidden" id="fb-rating" value="0">
        <div id="star-row"></div>
      </fieldset>
      <label>Góc nhập văn bản
        <textarea id="fb-msg" rows="3" maxlength="1500" required></textarea>
      </label>
      <button type="submit">Gửi phản hồi</button>
      <p id="fb-status" role="status"></p>
    </form>
  </details>
</main>

<!-- Live2D: PixiJS 6 + pixi-live2d-display + Cubism Core (bản chính thức của Live2D) -->
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script src="./vtuber-config.js?v=2"></script>
<script src="./vtuber.js?v=2"></script>
<script src="./script.js?v=2"></script>
</body>
</html>
